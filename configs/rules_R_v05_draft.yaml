# 共通ルール R v0.1（2026-11-09）。全モデルに同一に適用する。各ルールは ID・目的・対象・条件・優先順位・例を持つ。
# 追加・変更は 変更履歴（CHANGELOG や PR 説明）に「救えた見逃し / 増えた誤検知 / 処理時間」の前後比較を残す。
version: "0.5-draft"
rules:
  - id: R-PHONE-001
    kind: detect
    label: private_phone
    purpose: 日本の電話番号（携帯・固定・050・国際）。区切りなし/全角/括弧を含む。企業代表番号は R-KEEP-PHONE で抑制。
    priority: 60
    pattern: '(?<![0-9０-９\-－])(?:\+81[\-\s－]?[0-9０-９]{1,4}[\-\s－]?[0-9０-９]{1,4}[\-\s－]?[0-9０-９]{3,4}|[0０][7-9７-９][0０][0-9０-９]{8}|[0０][1-9１-９][0-9０-９]{0,3}[\-\s－（(]?[0-9０-９]{1,4}[)）]?[\-\s－]?[0-9０-９]{4})(?![0-9０-９])'
    examples_pos: ["090-1234-5678", "０５２－７６１－４４９８", "03(1234)5678", "08034567821", "+81-90-1234-5678"]
    examples_neg: ["12,000円", "2026-07-03", "型番 AB-12345678"]
  - id: R-EMAIL-001
    kind: detect
    label: private_email
    purpose: メールアドレス。共用アドレスは R-KEEP-EMAIL で抑制。
    priority: 70
    pattern: '[A-Za-z0-9._%+\-]+@(?:[A-Za-z0-9\-]+\.)+[A-Za-z]{2,}'
    examples_pos: ["t.shibata@example.jp", "minako_okabe@example.test"]
    examples_neg: ["@channel", "user@localhost"]
  - id: R-URL-001
    kind: detect
    label: private_url
    purpose: 個人識別子・トークンを含む URL（クエリに token/id/key、パスに個人用セグメント）。公開 URL は含めない。
    priority: 55
    pattern: 'https?://[A-Za-z0-9\-._~:/?#\[\]@!$&*+,;=%]+(?:\?(?:[A-Za-z0-9\-._~:/?#\[\]@!$&*+,;=%]*?)(?:token|key|sig|session|uid|user|id|code|auth|reset|track)=[A-Za-z0-9\-._~%]+[A-Za-z0-9\-._~:/?#\[\]@!$&*+,;=%]*|/(?:p|t|track|reset|u|users?|profile|invite|confirm)/[A-Za-z0-9_\-]{4,}[A-Za-z0-9\-._~:/?#\[\]@!$&*+,;=%]*)'
    examples_pos: ["https://track.example.test/p/8842xu", "https://portal.example.org/reset?token=abc123"]
    examples_neg: ["https://www.example.jp/products", "https://docs.example.com/"]
  - id: R-MYNUMBER-001
    kind: detect
    label: account_number
    purpose: マイナンバー（12 桁）。文脈語必須。チェックデジット不正でも機微な文脈なら MASK。
    priority: 65
    pattern: '(?<![0-9０-９])[0-9０-９]{4}[\-\s－]?[0-9０-９]{4}[\-\s－]?[0-9０-９]{4}(?![0-9０-９])'
    context_require: '(?:マイナンバー|個人番号|My ?Number)'
    examples_pos: ["マイナンバー：1234 5678 9012"]
    examples_neg: ["注文番号 1234-5678-9012（注文の文脈）"]
  - id: R-SECRET-001
    kind: detect
    label: secret
    purpose: 既知プレフィックスの API キー・トークン（sk-, AKIA, ghp_, xoxb-, JWT）。
    priority: 75
    pattern: '(?<![A-Za-z0-9])(?:sk-[A-Za-z0-9_\-]{8,}|AKIA[0-9A-Z]{12,}|ghp_[A-Za-z0-9]{20,}|xox[abp]-[A-Za-z0-9\-]{10,}|eyJ[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,})'
    examples_pos: ["sk-test-XYZ987abcdef", "AKIAIOSFODNN7EXAMPLE"]
    examples_neg: ["skill", "ghp"]
  - id: R-SECRET-002
    kind: detect
    label: secret
    purpose: key=value / 「パスワード：」形式の認証情報の値部分。
    priority: 74
    pattern: '(?i)(?:password|passwd|pwd|secret|api[_\-]?key|access[_\-]?token|token|パスワード|暗証番号)\s*[:=：]\s*["'']?(?P<v>[^\s"''、。]{4,})'
    examples_pos: ["password=Pr1v4cy!2026", "パスワード：abc12345"]
    examples_neg: ["パスワードを変更してください"]
  - id: R-KEEP-PHONE
    kind: suppress
    label: private_phone
    purpose: フリーダイヤル・ナビダイヤル等の企業代表番号は方針上 KEEP。
    pattern: '[0０](?:120|１２０|570|５７０|800|８００|990|９９０)[\-\s－]?[0-9０-９]{2,3}[\-\s－]?[0-9０-９]{3,4}'
    examples_pos: ["0120-330-118"]
  - id: R-KEEP-EMAIL
    kind: suppress
    label: private_email
    purpose: "info@/support@/order@/billing@/webmaster@ 等の共用アドレスは KEEP（v0.2 で語彙を拡張。dev_v1 で R 追加の負例誤検知 10 件がすべて order/billing/webmaster@ だったため）。"
    pattern: '(?i)(?:info|information|support|sales|contact|inquiry|inquiries|office|admin|administrator|noreply|no-reply|do-not-reply|donotreply|help|helpdesk|press|recruit|recruiting|careers|jobs|hr|cs|order|orders|billing|invoice|accounting|webmaster|postmaster|hostmaster|service|services|customer|customercare|desk|privacy|security|legal|compliance|reception|mail|contact-us|general|team|staff|news|newsletter|marketing|pr|ir|system|alert|alerts|notify|notification|notifications|bounce|mailer-daemon)@.+'
    examples_pos: ["info@example.jp"]
  - id: R-KEEP-PUBLIC-PERSON
    kind: suppress
    label: private_person
    purpose: "歴史上の人物・著名な公人（方針 §2: 公人名は KEEP）。span 全体が既知の公人名に一致する場合のみ抑制。一般の氏名には適用しない（v0.3）。注意: 合成 dev の PUBLIC_PERSON プールと重なるため dev 上の改善は過大評価になりうる。"
    pattern: '(?:徳川家康|徳川家光|徳川吉宗|徳川慶喜|豊臣秀吉|織田信長|明智光秀|武田信玄|上杉謙信|伊達政宗|毛利元就|真田幸村|石田三成|黒田官兵衛|前田利家|今川義元|北条早雲|足利尊氏|足利義満|源頼朝|源義経|平清盛|北条政子|聖徳太子|中大兄皇子|藤原道長|紫式部|清少納言|空海|最澄|親鸞|法然|日蓮|一遍|道元|西郷隆盛|大久保利通|木戸孝允|坂本龍馬|高杉晋作|吉田松陰|勝海舟|伊藤博文|大隈重信|板垣退助|福沢諭吉|渋沢栄一|新渡戸稲造|北里柴三郎|野口英世|津田梅子|樋口一葉|夏目漱石|森鷗外|芥川龍之介|太宰治|川端康成|三島由紀夫|宮沢賢治|与謝野晶子|正岡子規|石川啄木|松尾芭蕉|小林一茶|与謝蕪村|葛飾北斎|歌川広重|東洲斎写楽|千利休|世阿弥|雪舟|湯川秀樹|朝永振一郎|野依良治|山中伸弥|田中角栄|吉田茂|佐藤栄作|池田勇人|岸信介|二宮尊徳|杉田玄白|伊能忠敬|平賀源内|本居宣長|井原西鶴|近松門左衛門|滝廉太郎|山田耕筰|黒澤明|手塚治虫|美空ひばり|石原裕次郎|長嶋茂雄|王貞治|イチロー|大谷翔平|松下幸之助|本田宗一郎|盛田昭夫|井深大|豊田喜一郎|安藤百福|小泉純一郎|安倍晋三|菅義偉|岸田文雄|石破茂|小池百合子|天海祐希|宮崎駿|村上春樹|大江健三郎|卑弥呼|聖武天皇|桓武天皇|後醍醐天皇|明治天皇|昭和天皇|アルベルト・アインシュタイン|アインシュタイン|ニュートン|ガリレオ・ガリレイ|レオナルド・ダ・ヴィンチ|ナポレオン|リンカーン|エジソン|ベートーヴェン|モーツァルト|シェイクスピア|ピカソ|ゴッホ|マリー・キュリー|チャーチル|ガンジー|マザー・テレサ|スティーブ・ジョブズ|ビル・ゲイツ|イーロン・マスク|バラク・オバマ|ドナルド・トランプ|ジョー・バイデン|エマニュエル・マクロン|アンゲラ・メルケル|習近平|プーチン)(?:氏|さん|様|公|殿)?'
    examples_pos: ["徳川家康", "北里柴三郎"]
    examples_neg: ["田中太郎"]
  - id: R-KEEP-CORP-NAME
    kind: suppress
    label: private_person
    purpose: "姓を含む法人名（大和田ロジスティクス、田中建設 等）は人名ではなく会社名なので KEEP（v0.3）。span 全体が法人接尾辞で終わる場合のみ抑制。"
    pattern: '.{1,20}(?:株式会社|合同会社|有限会社|合資会社|ホールディングス|グループ|コーポレーション|カンパニー|インダストリー|インダストリーズ|テクノロジー|テクノロジーズ|システムズ|サービス|ネットワークス|エンジニアリング|コンサルティング|パートナーズ|ロジスティクス|ソリューションズ|商事|商店|商会|工業|工務店|製作所|産業|興業|建設|電機|電器|物産|不動産|運輸|運送|銀行|信用金庫|証券|保険|薬品|製薬|化学|化成|食品|製菓|印刷|出版|学園|学院|病院|医院|クリニック|法律事務所|会計事務所|税理士法人|監査法人|社会保険労務士法人|組合|協会|財団|機構|センター|研究所|事務所)'
    examples_pos: ["大和田ロジスティクス", "田中建設"]
    examples_neg: ["田中太郎"]
  - id: R-KEEP-REQUEST-ID
    kind: suppress
    label: secret
    purpose: "v0.5 案: HTTP ヘッダ等のリクエスト ID・トレース ID（X-Request-Id, X-Correlation-Id, trace-id, リクエストID）は秘密情報ではない（dev の負例誤検知 7 件中 6 件、locked でも secret の誤検知が最多）。直前 40 文字にヘッダ名がある secret span を抑制する。"
    pattern: '[A-Za-z0-9][A-Za-z0-9\-]{3,}'
    context_require: '(?i)(?:x-request-id|request-id|requestid|x-correlation-id|correlation-id|x-trace-id|trace-id|traceid|x-b3-traceid|リクエスト\s*ID|トレース\s*ID|受付\s*ID)\s*[:=：]\s*$'
    examples_pos: ["X-Request-Id: 7f3c9a10-5b2e-4c1d-9e6a-0d4b8a21c7f5"]
    examples_neg: ["api_key: sk-live-abc123"]
  - id: R-KEEP-PRODUCT-CODE
    kind: suppress
    label: secret
    purpose: "v0.5 案: 製品コード・型番・品番・リーフレット番号として明示された英数字列は秘密情報ではない。"
    pattern: '[A-Z]{1,4}[0-9]{1,4}-[0-9A-Z]{2,6}'
    context_require: '(?:製品コード|型番|品番|部品番号|リーフレット|カタログ番号|モデル番号|Model|SKU)\s*(?:は|:|：|=)?\s*$'
    examples_pos: ["製品コードAQ55-3156", "リーフレットはTM53-3894"]
  - id: R-BOUND-001
    kind: boundary
    purpose: "モデル span の端から敬称・ラベル語・括弧・句読点を外す（annotation_policy §3）。v0.4: 先頭の読点・引用符、ラベル語 ApiKey/APIキー/トークン（区切りなし可）、日付末尾の助詞（に・から・まで・より・の・へ）を追加。"
    examples_pos: ["山田太郎様 → 山田太郎", "TEL:090-1234-5678 → 090-1234-5678"]
